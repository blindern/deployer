[project]
name = "blindern-deployer"
version = "0.1.0"
description = "Automated deployment of our services"
authors = [{ name = "Henrik Steen", email = "henrist@henrist.net" }]
requires-python = "==3.15.*"
dependencies = [
    "ansible==15.0.0",
    "Flask==3.1.3",
    "Flask-Injector==0.15.0",
    "gunicorn==25.3.0",
    "injector==0.24.0",
    "NamedAtomicLock==1.1.3",
    "pydantic==2.14.4",
    "PyJWT[crypto]>=2.8.0",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "ty==0.0.107",
]

[tool.uv]
package = false
exclude-newer = "3 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
]

[tool.ty.rules]
import-not-found = "warn"
